# Render Blueprint for the Ask Thy Monk FastAPI backend.
#
# Deploy: Render dashboard -> New + -> Blueprint -> connect this GitHub repo.
# Render reads this file, creates the service, and PROMPTS for every env var
# (all are sync:false, so no secrets are ever stored in this repo).
#
# Dependencies: the repo is uv-based (pyproject.toml), but Render's Python
# buildpack expects requirements.txt. backend/requirements.txt mirrors the
# runtime deps exactly and is used here. Keep it in sync on dep changes
# (or regenerate with `uv export --no-hashes -o requirements.txt`).

services:
  - type: web
    name: askthymonk-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Bind to the port Render injects at runtime — never a hardcoded port.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # --- Secrets (enter real values in the Render dashboard) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_API_KEY_EN
        sync: false
      # Shared-secret gate: when set, /api/wisdom requires a matching X-API-Key.
      # The mobile app must send the SAME value via EXPO_PUBLIC_API_KEY.
      - key: API_SHARED_SECRET
        sync: false
      # --- Pinecone indexes ---
      - key: PINECONE_INDEX
        sync: false
      - key: PINECONE_INDEX_EN
        sync: false
      # --- Models ---
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_MODEL_EN
        sync: false
      - key: CHAT_MODEL
        sync: false
      # --- Retrieval ---
      - key: TOP_K
        sync: false
      - key: TOP_K_EN
        sync: false
      # English-only retrieval-relevance floor on the top match score (default
      # 0.45 in code). Declared so it can be tuned from the dashboard without a
      # code change; leave unset to use the code default. Hindi has no floor.
      - key: EN_SCORE_FLOOR
        sync: false
      # --- App behavior ---
      - key: SUPPORTED_LANGUAGES
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT
        sync: false
      # --- Guardrail (Layer 1 name-suppression blocklist) ---
      # Declared here so a Blueprint re-sync KNOWS this variable is required and
      # never silently drops it. The actual pipe-separated blocklist lives ONLY
      # in the Render dashboard (sync:false, no value here) — the source
      # blocklist.txt is gitignored and never committed. If this var is missing,
      # Layer 1 goes silently inert (startup log shows terms=0); with it set the
      # log shows terms=N (N>0).
      - key: BLOCKLIST_TERMS
        sync: false
